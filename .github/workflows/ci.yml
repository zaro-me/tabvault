name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tabvault/package-lock.json

      - name: Install dependencies
        working-directory: tabvault
        run: npm ci

      - name: Lint
        working-directory: tabvault
        run: npm run lint

      - name: Test
        working-directory: tabvault
        run: npm run test

      - name: Build (Chrome)
        working-directory: tabvault
        run: npm run build

      - name: Build (Firefox)
        working-directory: tabvault
        run: npm run build:firefox
